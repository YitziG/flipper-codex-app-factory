name: "FAP: Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            sdk-channel: release
          - name: dev
            sdk-channel: dev
    name: "Release FAP: ${{ matrix.name }}"
    env:
      UFBT_HOME: ${{ github.workspace }}/.ufbt/${{ matrix.sdk-channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install uFBT
        run: python -m pip install --upgrade ufbt

      - name: Deploy uFBT SDK
        run: ufbt update --channel "${{ matrix.sdk-channel }}"

      - name: Build apps
        run: |
          for manifest in apps/*/application.fam; do
            app_dir="$(dirname "$manifest")"
            echo "::group::Build ${app_dir}"
            (cd "$app_dir" && ufbt)
            echo "::endgroup::"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: faps-${{ matrix.name }}
          path: apps/*/dist/*.fap
          if-no-files-found: error

      - name: Attach FAP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.sdk-channel == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/*/dist/*.fap
